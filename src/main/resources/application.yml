# Base configuration shared by every profile.
# Secrets and environment-specific values come from environment variables
# (or a local, git-ignored .env file) - nothing sensitive is hardcoded here.
spring:
  application:
    name: ${APP_NAME:spring-boot-starter-template}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    # Lets you run from an IDE / `gradle bootRun` using the same .env as Docker Compose.
    import: optional:file:./.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:appdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Liquibase owns the schema. Set JPA_DDL_AUTO=validate to make Hibernate verify entities against it.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jackson:
    default-property-inclusion: non_null

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    persist-authorization: true
  default-produces-media-type: application/json

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: ${JWT_EXPIRATION:60m}
    issuer: ${spring.application.name}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Administrator}
